name: Build with Autotools
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
      runs-on: ${{ matrix.runner }}
      strategy:
          fail-fast: false
          matrix:
              # Listed explicitly: an `include:` entry that overrides a base
              # matrix key spawns a bare combination instead of augmenting it.
              include:
                - runner: ubuntu-latest
                  compiler-settings: ''
                - runner: ubuntu-latest
                  compiler-settings: 'CXX=clang++ CC=clang'
                - runner: macos-latest
                  compiler-settings: ''
                - runner: macos-latest
                  compiler-settings: 'CXX=g++ CC=gcc'
      steps:
      - name: Install dependencies
        uses: actions/setup-python@v7
        with:
            python-version: '3.10' 
            
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies for macOS
        if: matrix.runner == 'macos-latest'
        run: brew install autoconf automake libtool openssl

      - name: Link dependencies for macOS
        if: matrix.runner == 'macos-latest'
        run: brew link autoconf automake libtool openssl

      - name: Bootstrap
        shell: bash
        run: ./bootstrap

      - name: Configure ${{ matrix.compiler-settings }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export CPPFLAGS="-I$(brew --prefix openssl)/include"
            export LDFLAGS="-L$(brew --prefix openssl)/lib"
          fi
          env ${{ matrix.compiler-settings }} ./configure --with-python3 --with-ruby --with-openssl

      - name: Make
        shell: bash
        run:  make

      - name: Make check
        shell: bash
        run: make check
