name: Build with CMake
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
      runs-on: ${{ matrix.runner }}
      strategy:
          fail-fast: false
          matrix:
              runner: [windows-2022, ubuntu-latest, macos-latest]
              configuration: [Debug, Release]
              ssl: ['OFF', 'ON']
              # '' is each platform's default compiler; 'alt' is the second one
              # selected in the step below. Pruned to Release + SSL=ON so the
              # extra coverage costs three jobs rather than twelve.
              compiler: ['', 'alt']
              exclude:
                - compiler: 'alt'
                  configuration: Debug
                - compiler: 'alt'
                  ssl: 'OFF'
                # No clang-cl on Windows: the runner image ships it, but
                # `-T ClangCL` is unreliable there (actions/runner-images#4716).
                # Delete this entry to re-enable once that is fixed.
                - compiler: 'alt'
                  runner: windows-2022
              include:
                # Two disjoint 20-port windows, so a Debug and a Release build of
                # the same checkout never contend for a port.
                - configuration: Debug
                  portbase: 6660
                - configuration: Release
                  portbase: 6680
      steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install OpenSSL (macOS)
        if: matrix.ssl == 'ON' && matrix.runner == 'macos-latest'
        run: brew install openssl
      - name: Install OpenSSL (Linux)
        if: matrix.ssl == 'ON' && matrix.runner == 'ubuntu-latest'
        run: sudo apt-get install -y libssl-dev
      - name: Set OPENSSL_ROOT_DIR (macOS)
        if: matrix.ssl == 'ON' && matrix.runner == 'macos-latest'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl" >> $GITHUB_ENV
      - name: Set OPENSSL_ROOT_DIR (Windows)
        if: matrix.ssl == 'ON' && matrix.runner == 'windows-2022'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL" >> $GITHUB_ENV
      - name: Select alternate compiler
        if: matrix.compiler == 'alt'
        shell: bash
        run: |
          case "$Runner" in
            ubuntu-latest) echo "CC=clang"  >> $GITHUB_ENV
                           echo "CXX=clang++" >> $GITHUB_ENV ;;
            macos-latest)  echo "CC=gcc"    >> $GITHUB_ENV
                           echo "CXX=g++"     >> $GITHUB_ENV ;;
            # windows-2022 is excluded from the alt compiler above; this branch
            # is what it would use if re-enabled.
            windows-2022)  echo "CMAKE_EXTRA=-T ClangCL" >> $GITHUB_ENV ;;
          esac
        env:
          Runner: ${{ matrix.runner }}
      - name: Generate
        shell: bash
        run: |
          cmake . -DCMAKE_BUILD_TYPE=$Configuration -DCMAKE_INSTALL_PREFIX=../install_prefix/$Configuration \
            -DHAVE_SSL=$SSL -DHAVE_PYTHON3=ON -DQUICKFIX_TEST_PORT_BASE=$PortBase \
            ${CMAKE_EXTRA:-} ${OPENSSL_ROOT_DIR:+-DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"}
        env:
          Configuration: ${{ matrix.configuration }}
          SSL: ${{ matrix.ssl }}
          PortBase: ${{ matrix.portbase }}
          OPENSSL_ROOT_DIR: ${{ env.OPENSSL_ROOT_DIR }}
          CMAKE_EXTRA: ${{ env.CMAKE_EXTRA }}
      - name: Build
        shell: bash
        run: |
          cmake --build . --config $Configuration
        env:
          Configuration: ${{ matrix.configuration }}
      - name: Test
        shell: bash
        run: |
          set -eu
          # The label filter is what reproduces the previous per-step policy:
          # unit and python on every leg, perf only for Release, and the
          # acceptance suite (~90s, and the flakiest) only on pull requests.
          LABELS='unit|python'
          [ "$Configuration" = 'Release' ] && LABELS="$LABELS|perf"
          [ "$EventName" = 'pull_request' ] && LABELS="$LABELS|acceptance"
          # --no-tests=error replaces the old "Check if tests were built" step,
          # which skipped a suite when its binary was missing -- reporting a
          # build regression as a green run.
          ctest --build-config "$Configuration" \
                --label-regex "^($LABELS)$" \
                --output-on-failure \
                --no-tests=error \
                --timeout 900
        env:
          Configuration: ${{ matrix.configuration }}
          EventName: ${{ github.event_name }}
      - name: Upload CTest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.runner }}-${{ matrix.configuration }}-ssl${{ matrix.ssl }}${{ matrix.compiler }}
          path: |
            Testing/Temporary/LastTest.log
            test/*.log
          if-no-files-found: ignore
