name: Build with CMake
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
      runs-on: ${{ matrix.runner }}
      strategy:
          fail-fast: false
          matrix:
              runner: [windows-2022, ubuntu-latest, macos-latest]
              configuration: [Debug, Release]
              ssl: ['OFF', 'ON']
              # '' is each platform's default compiler; 'alt' is the second one
              # selected in the step below. Pruned to Release + SSL=ON so the
              # extra coverage costs three jobs rather than twelve.
              compiler: ['', 'alt']
              exclude:
                - compiler: 'alt'
                  configuration: Debug
                - compiler: 'alt'
                  ssl: 'OFF'
                # No clang-cl on Windows: the runner image ships it, but
                # `-T ClangCL` is unreliable there (actions/runner-images#4716).
                # Delete this entry to re-enable once that is fixed.
                - compiler: 'alt'
                  runner: windows-2022
              include:
                - configuration: Debug
                  config: debug
                  portoffset: 0
                - configuration: Release
                  config: release
                  portoffset: 1
      steps:
      - name: Echo event_name ${{ github.event_name }}
        shell: bash
        run: echo "github.event_name $event_name"
        env:
          event_name: ${{ github.event_name }}
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install OpenSSL (macOS)
        if: matrix.ssl == 'ON' && matrix.runner == 'macos-latest'
        run: brew install openssl
      - name: Install OpenSSL (Linux)
        if: matrix.ssl == 'ON' && matrix.runner == 'ubuntu-latest'
        run: sudo apt-get install -y libssl-dev
      - name: Set OPENSSL_ROOT_DIR (macOS)
        if: matrix.ssl == 'ON' && matrix.runner == 'macos-latest'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl" >> $GITHUB_ENV
      - name: Set OPENSSL_ROOT_DIR (Windows)
        if: matrix.ssl == 'ON' && matrix.runner == 'windows-2022'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL" >> $GITHUB_ENV
      - name: Select alternate compiler
        if: matrix.compiler == 'alt'
        shell: bash
        run: |
          case "$Runner" in
            ubuntu-latest) echo "CC=clang"  >> $GITHUB_ENV
                           echo "CXX=clang++" >> $GITHUB_ENV ;;
            macos-latest)  echo "CC=gcc"    >> $GITHUB_ENV
                           echo "CXX=g++"     >> $GITHUB_ENV ;;
            # windows-2022 is excluded from the alt compiler above; this branch
            # is what it would use if re-enabled.
            windows-2022)  echo "CMAKE_EXTRA=-T ClangCL" >> $GITHUB_ENV ;;
          esac
        env:
          Runner: ${{ matrix.runner }}
      - name: Generate
        shell: bash
        run: |
          cmake . -DCMAKE_BUILD_TYPE=$Configuration -DCMAKE_INSTALL_PREFIX=../install_prefix/$Configuration \
            -DHAVE_SSL=$SSL -DHAVE_PYTHON3=ON ${CMAKE_EXTRA:-} ${OPENSSL_ROOT_DIR:+-DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"}
        env:
          Configuration: ${{ matrix.configuration }}
          SSL: ${{ matrix.ssl }}
          OPENSSL_ROOT_DIR: ${{ env.OPENSSL_ROOT_DIR }}
          CMAKE_EXTRA: ${{ env.CMAKE_EXTRA }}
      - name: Build
        shell: bash
        run: |
          cmake --build . --config $Configuration
        env:
          Configuration: ${{ matrix.configuration }}
      - name: Set tests paths windows
        shell: bash
        if: ${{ matrix.runner == 'windows-2022' }}
        run: |
          echo "at=$PWD/test/$Config/at/at.exe" >> $GITHUB_ENV
          echo "pt=$PWD/test/$Config/pt/pt.exe" >> $GITHUB_ENV
          echo "ut=$PWD/test/$Config/ut/ut.exe" >> $GITHUB_ENV
        env:
          Config: ${{ matrix.config }}
      - name: Set tests paths ubuntu-latest
        shell: bash
        if: ${{ matrix.runner == 'ubuntu-latest' }}
        run: |
          echo "at=$PWD/test/at" >> $GITHUB_ENV
          echo "pt=$PWD/test/pt" >> $GITHUB_ENV
          echo "ut=$PWD/test/ut" >> $GITHUB_ENV
      - name: Set tests paths macos-latest
        shell: bash
        if: ${{ matrix.runner == 'macos-latest' }}
        run: |
          echo "at=$PWD/test/at" >> $GITHUB_ENV
          echo "pt=$PWD/test/pt" >> $GITHUB_ENV
          echo "ut=$PWD/test/ut" >> $GITHUB_ENV
      - name: Echo test paths ${{ matrix.runner }}
        shell: bash
        run: |
          echo "at: $at"
          echo "pt: $pt"
          echo "ut: $ut"
        env:
          at: ${{ env.at }}
          pt: ${{ env.pt }}
          ut: ${{ env.ut }}
      - name: Check if tests were built
        id: check_files
        shell: bash
        run: |
          AT=$( test -f $at && echo "true" || echo "false" )
          PT=$( test -f $pt && echo "true" || echo "false" )
          UT=$( test -f $ut && echo "true" || echo "false" )
          echo "at_check=$AT" >> $GITHUB_ENV
          echo "pt_check=$PT" >> $GITHUB_ENV
          echo "ut_check=$UT" >> $GITHUB_ENV
        env:
          at: ${{ env.at }}
          pt: ${{ env.pt }}
          ut: ${{ env.ut }}
      - name: Echo test checks ${{ matrix.runner }}
        shell: bash
        run: |
          echo "at_check: $at_check"
          echo "pt_check: $pt_check"
          echo "ut_check: $ut_check"
        env:
          at_check: ${{ env.at_check }}
          pt_check: ${{ env.pt_check }}
          ut_check: ${{ env.ut_check }}
      - name: Run acceptance tests for windows
        if: ${{ env.at_check == 'true' && matrix.runner == 'windows-2022' && github.event_name == 'pull_request' }}
        shell: cmd
        working-directory: ./test
        run: |
          set /a "PORT=%PortBase%+%Offset%"
          runat %CONFIG% %PORT%
        env:
          CONFIG: ${{ matrix.config }}
          PortBase: 6666
          Offset: ${{ matrix.portoffset }}
      - name: Run acceptance tests for ${{ matrix.runner }}
        if: ${{ env.at_check == 'true' && matrix.runner != 'windows-2022' && github.event_name == 'pull_request' }}
        shell: bash
        working-directory: ./test
        run: |
          ./runat.sh $(($PortBase + $Offset))
        env:
          PortBase: 6666
          Offset: ${{ matrix.portoffset }}
      - name: Run performance tests
        if: ${{ env.pt_check == 'true' && matrix.configuration == 'Release' }}
        shell: bash
        working-directory: ./test
        run: |
          $pt --quickfix-spec-path ../spec -# "~[network]"
          $pt --quickfix-spec-path ../spec -# "[network]" --port $(($PortBase + $Offset))
        env:
          pt: ${{ env.pt }}
          PortBase: 6668
          Offset: ${{ matrix.portoffset }}
      - name: Run unit tests
        if: ${{ env.ut_check == 'true' }}
        shell: bash
        working-directory: ./test
        run: |
          $ut --quickfix-config-file cfg/ut.cfg --quickfix-spec-path ../spec
        env:
          ut: ${{ env.ut }}
