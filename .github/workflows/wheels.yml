name: Build wheels

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'tools/verify_wheel.py'
      - '.github/workflows/wheels.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every target is built on its own native runner - no emulation and no
        # cross-compilation, so the test step actually runs on the target.
        os:
          - ubuntu-latest      # manylinux x86_64
          - ubuntu-24.04-arm   # manylinux aarch64
          - windows-latest     # win_amd64
          - windows-11-arm     # win_arm64
          - macos-13           # macOS x86_64
          - macos-latest       # macOS arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error


  # Free-threaded wheels are EXPECTED TO FAIL and are deliberately not part of
  # `publish`'s needs, so they can never block or enter a release.
  #
  # Two known blockers, in the order they are hit:
  #  1. CMake does not derive the free-threaded ABI from a venv interpreter, so
  #     find_package(Python3 COMPONENTS Development) misses python3XXt.lib and the
  #     configure step fails. Reproduced locally on 3.14.7t.
  #  2. Behind that sits quickfix/quickfix#611: SWIG's overloaded setField/getField
  #     dispatch misbehaves without the GIL. tools/verify_wheel.py exercises this
  #     concurrently, so the test step is what should catch it once (1) is fixed.
  #
  # This lane exists to track when those stop being true.
  build_wheels_freethreaded:
    name: Free-threaded wheels on ${{ matrix.os }} (expected red)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build free-threaded wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ENABLE: cpython-freethreading
          CIBW_BUILD: 'cp313t-* cp314t-*'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-freethreaded-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: ignore
  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only ever on an explicit version tag, never on a pull request.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/quickfix-tls
    permissions:
      # Required for PyPI trusted publishing; no API token is stored.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The version published is whatever pyproject.toml says, not what the tag
      # says. A mismatch would upload the wrong number under a misleading tag,
      # and PyPI versions can never be reused or corrected -- so fail first.
      - name: Verify the tag matches the project version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          project=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag project=$project"
          if [ "$tag" != "$project" ]; then
            echo "::error::tag v$tag does not match pyproject.toml version $project" >&2
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.14.2
