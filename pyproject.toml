[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
# Unofficial fork of the official `quickfix` distribution, which ships source-only.
# The import name stays `quickfix`, so this is a drop-in replacement and the two
# cannot be installed side by side - see README-PyPI.md.
name = "quickfix-tls"
# <upstream>.<fork-revision>. The first three segments are the upstream QuickFIX
# release this is built from; the fourth counts fork releases against it. Never
# publish a bare upstream number: upstream's own 1.16.0 exists and differs from
# this build, and PyPI versions can never be reused. Start the counter at .1 --
# PEP 440 zero-pads, so 1.16.0.0 would compare equal to 1.16.0.
version = "1.16.0.1rc1"
description = "QuickFIX with TLS/SSL transports, as prebuilt wheels (unofficial fork)"
readme = "README-PyPI.md"
# This is the single source of truth for the supported floor: cibuildwheel reads
# it to decide which interpreters to build, so it must not claim a version that
# is never built. 3.8 is EOL and no cp38 wheel has ever been published.
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Oren Miller and QuickFIX contributors" }]
maintainers = [{ name = "Hartmut Juergens" }]
keywords = ["FIX", "QuickFIX", "trading", "protocol", "SSL", "TLS"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/hjuergens/quickfix-python"
Upstream = "https://github.com/quickfix/quickfix"
Documentation = "https://quickfixengine.org/"

[tool.scikit-build]
# Delegates to the repository's CMakeLists so the C++ source list is never duplicated.
cmake.version = ">=3.15"
cmake.build-type = "Release"
build.targets = ["_quickfix"]
# Installs only the wheel component defined in src/python3/CMakeLists.txt, which
# places _quickfix.pyd and the quickfix*.py modules at the archive root.
install.components = ["python_wheel"]
wheel.install-dir = ""
build-dir = "build/wheel-{wheel_tag}"
sdist.exclude = ["build", "lib", ".github"]
# Belt and braces: both templates are tracked and no longer hidden by a
# .gitignore rule, but the CMake configure step fails without them, and
# cibuildwheel builds its wheels from the sdist.
sdist.include = ["cmake_config.h.in", "quickfix.pc.in"]

[tool.scikit-build.cmake.define]
HAVE_SSL = "ON"
HAVE_PYTHON3 = "ON"
QUICKFIX_EXAMPLES = "OFF"
QUICKFIX_TESTS = "OFF"
# The wheel's install component (python_wheel, in src/python3/CMakeLists.txt) only
# ships _quickfix and the Python wrapper modules, never libquickfix itself - and
# Windows already always builds it STATIC regardless of this flag (see
# src/C++/CMakeLists.txt). Match that on Linux/macOS so _quickfix has no external
# runtime dependency for auditwheel/delocate to fail to find.
QUICKFIX_SHARED_LIBS = "OFF"
# OPENSSL_ROOT_DIR is intentionally not pinned here; pass it per machine, e.g.
#   pip wheel . -C cmake.define.OPENSSL_ROOT_DIR=C:/path/to/openssl
# or set the OPENSSL_ROOT_DIR environment variable, which find_package(OpenSSL) honours.

[tool.cibuildwheel]
# `build` is explicit, and that is a reversal: it used to be unset so that a new
# CPython was picked up automatically by bumping the cibuildwheel pin. That works
# right up until the new interpreter is broken, and then it blocks every release
# on every platform at once, because the publish job needs all of them. CPython
# 3.15 did exactly that -- it aborts at interpreter finalization
# (see TODO.md), and with an automatic matrix there is no way to ship anything
# while that is unresolved.
#
# So: adding a Python version is now a deliberate edit to this list, made after
# it has been tested. The cost is that someone has to remember; the benefit is
# that a prerelease interpreter cannot take the release path hostage.
build = [
  "cp39-*", "cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*",
]
#
# Free-threaded builds are not included: they require CIBW_ENABLE, which only the
# (expected-red) free-threaded lane in that workflow sets.
#
# musllinux and 32-bit targets are deliberately not built yet; add them once the
# matrix below is proven green.
# CPython ships Windows arm64 builds from 3.11 on, so cp39/cp310 do not exist there.
skip = ["*-win32", "*_i686", "*-musllinux_*", "pp*", "cp39-win_arm64", "cp310-win_arm64"]
build-frontend = "build"
# Runs against the installed wheel, and fails if it was built without SSL.
test-command = "python {project}/tools/verify_wheel.py"

[tool.cibuildwheel.linux]
# Not the container's openssl-devel: manylinux_2_28 is AlmaLinux 8, which ships
# 1.1.1k (end of life since September 2023) and has no openssl3 package. A wheel
# freezes whatever it was built against either way, so this builds a pinned,
# supported OpenSSL instead - see tools/setup_openssl.sh.
# perl-core, because OpenSSL's Configure needs IPC::Cmd (and FindBin, and
# Data::Dumper) which the manylinux image's minimal perl does not carry.
before-all = "yum install -y perl-core || dnf install -y perl-core; bash {package}/tools/setup_openssl.sh"
environment = { OPENSSL_ROOT_DIR = "/tmp/openssl-static" }

[tool.cibuildwheel.macos]
# See tools/setup_openssl.sh: Homebrew's arm64 openssl@3 bottle has been
# observed to require a much newer minimum macOS (26.0) than this project
# targets, which delocate then refuses to bundle into an 11.0-floor wheel.
# Build a static OpenSSL from source instead, pinned to our own deployment
# target - static means there is nothing for delocate to bundle at all.
before-all = "bash {package}/tools/setup_openssl.sh"
environment = { OPENSSL_ROOT_DIR = "/tmp/openssl-static", MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.cibuildwheel.windows]
# Not the runner image's OpenSSL: 1.16.0.1rc1 shipped 3.6.4 on Windows against
# 3.5.8 everywhere else, and 3.6 is not an LTS release - its support ends
# 2026-11-01 where 3.5 runs to 2030-04-08. The image version also moves without
# notice, so a rebuilt tag would not produce the same wheel. Build the same
# pinned version the other platforms use; see tools/setup_openssl.ps1.
before-all = "powershell -NoProfile -ExecutionPolicy Bypass -File {package}\\tools\\setup_openssl.ps1"
environment = { OPENSSL_ROOT_DIR = "C:/openssl-static" }
# Still delvewheel, but only for the MSVC runtime now: with OpenSSL linked
# statically there are no OpenSSL DLLs left to vendor, and nothing for the loader
# to find beside the .pyd.
before-build = "pip install delvewheel==1.13.1"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"
